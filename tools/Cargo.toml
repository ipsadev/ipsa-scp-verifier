[package]
name = "tools"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.81.0"
publish = false

[lib]
name = "tools"
path = "src/lib.rs"

[[bin]]
name = "tools"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
flate2 = "1"
hex = "0.4"
ring = "0.17"
serde_json = "1"
ureq = "2.10"

[lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "deny", priority = 2 }

[lints.clippy]
use_self = "warn"
